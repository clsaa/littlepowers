name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts hooks tests
      - name: Validate Claude Code plugin
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-code" --include=optional @anthropic-ai/claude-code@2.1.212
          node "$RUNNER_TEMP/claude-code/node_modules/@anthropic-ai/claude-code/install.cjs"
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" plugin validate --strict .
