name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts hooks tests
      - name: Probe polyglot Hook launcher on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          start_output=$(python scripts/littlepowers_state.py start \
            --objective "Windows launcher probe" \
            --phase execute \
            --next-action "Read prompt-boundary state")
          test -n "$start_output"
          native_root=$(pwd -W)
          hook_output=$(printf '%s' \
            '{"cwd":"'"$native_root"'","hook_event_name":"UserPromptSubmit"}' \
            | CLAUDE_PLUGIN_ROOT="$native_root" hooks/run-hook.cmd)
          case "$hook_output" in
            *UserPromptSubmit*workflow_id*) ;;
            *) printf '%s\n' "$hook_output"; exit 1 ;;
          esac

  claude-plugin:
    name: Claude Code strict validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Validate Claude Code plugin
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-code" \
            --include=optional @anthropic-ai/claude-code@2.1.212
          node "$RUNNER_TEMP/claude-code/node_modules/@anthropic-ai/claude-code/install.cjs"
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" plugin validate --strict .
